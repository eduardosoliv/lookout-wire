[project]
name = "lookout-wire"
version = "0.1.0"
description = "A personal WhatsApp agent for financial alerts."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-genai>=2.31",
    "httpx>=0.28.1,<0.29",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "pyyaml>=6.0.3",
]

[project.scripts]
lookout-wire = "lookout_wire.main:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.10,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "N"]
