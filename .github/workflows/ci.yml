# Runs the same `just check` as the pre-commit hook on every pull request and on main.
# Branch protection on main requires the `check` job to pass before a pull request can merge.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - uses: extractions/setup-just@v4
      - name: Install dependencies from the lockfile
        run: uv sync --locked
      - name: Lint, format check, and tests
        run: just check
